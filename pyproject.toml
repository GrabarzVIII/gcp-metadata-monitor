[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-metadata-monitor"
version = "0.1.0"
description = "Metadata-driven GCP log and data quality monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "google-cloud-bigquery>=3.30,<4",
  "google-cloud-logging>=3.11,<4",
  "google-cloud-storage>=3,<4",
  "Jinja2>=3.1.6,<4",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
gcp-monitor = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
