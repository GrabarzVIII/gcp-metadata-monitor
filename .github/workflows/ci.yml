name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check main.py src tests
      - run: ruff format --check main.py src tests
      - run: python -m pytest -q
      - run: python -m src.cli validate examples/rules.json
      - run: python -m src.cli demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: reports/demo

  function-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify function loading without cloud credentials
        run: |
          python -c "import functions_framework; app = functions_framework.create_app('run_monitoring', 'main.py'); assert app.test_client().get('/healthz').json == {'status': 'ok'}"
